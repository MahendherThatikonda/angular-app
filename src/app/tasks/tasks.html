@if (isAddingTask) {
    <app-new-task (cancel)="onCancelAddTask()" (add)="onAddTask($event)"/>
}

<section id="tasks">
    <header>
        <h1>{{name}}'s Tasks</h1>
        <menu>
            <button (click)="onStartAddTask()">Add Task</button>
        </menu>
    </header>
      <p>userId received: {{ userId }}</p>  <!-- ← add this -->
  <p>tasks count: {{ selectedUserTasks.length }}</p>
    <ul>
        @for (task of selectedUserTasks; track task.id) {
                    <li>
                        <app-task [task]="task" (complete)="onCompleteTask($event)"/>
                    </li>
        }

    </ul>


</section>
